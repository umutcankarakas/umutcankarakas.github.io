title: "Umut Can Karakaş"
description: "Yazılar, fotoğraflar ve düşünceler."
url: "https://umutcankarakas.github.io"
baseurl: ""

author:
  name: "Umut Can Karakaş"
  bio: "Yazar & Fotoğrafçı"
  email: ""

github_url: "https://github.com/umutcankarakas"
github_username: "umutcankarakas"
medium_url: "https://medium.com/@karakasu"
# twitter_url: "https://twitter.com/umutcankarakas"  # Twitter varsa aç

# Build settings
markdown: kramdown
highlighter: rouge
permalink: /yazi/:year/:month/:day/:title/

# Plugins
plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-paginate

paginate: 6
paginate_path: "/sayfa/:num/"

# Collections
collections:
  pages:
    output: true
    permalink: /:name/

# Exclude from build
exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - node_modules

# Defaults
defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"
      author: "Umut Can Karakaş"
